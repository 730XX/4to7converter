name: "Publicar Release"

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Caché de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./app/src-tauri -> target"

      - name: Instalar .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Compilar osu-detector helper
        run: |
          dotnet build app/src-tauri/osu-detector/osu-detector.csproj -c Release -r win-x86

      - name: Instalar dependencias frontend
        run: |
          npm ci || npm install
          npm --prefix app ci || npm --prefix app install

      - name: Extraer notas de versión desde CHANGELOG.md
        id: changelog_reader
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Buscando notas para la versión: $VERSION"
          
          python - <<EOF
          import re, os

          version = "$VERSION"
          notes = f"Notas de la versión v{version}"
          try:
              with open("CHANGELOG.md", "r", encoding="utf-8") as f:
                  content = f.read()

              pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()
          except Exception as e:
              pass

          # Formato seguro multilinea para GITHUB_OUTPUT
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as gh_out:
              gh_out.write("notes<<EOF\n" + notes + "\nEOF\n")
          EOF

      - name: Compilar y publicar Release con Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./app"
          tagName: ${{ github.ref_name }}
          releaseName: "v__VERSION__"
          releaseBody: ${{ steps.changelog_reader.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
