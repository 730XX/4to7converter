</head>
<body>
    <script>
          window.addEventListener("DOMContentLoaded", async () => {
    await new Promise(r => setTimeout(r, 6000));
    try {
      const invoke = window.__TAURI__.core.invoke;
      await invoke("splash_screen");
    } catch (e) {
      console.error("Failed to finish splash:", e);
    }
  });

    </script>
