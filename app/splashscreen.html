<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cargando 4to7 Mania...</title>
  <style>
    /* Estilos inline inmediatos (0ms delay de carga de red/archivo CSS) */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0b0e14;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0e14;
    }
    .splash-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .splash-loader {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .splash-loader-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #5b8cff, #a3ff38);
      border-radius: 2px;
      animation: progressLoad 2.5s ease-in-out infinite;
      transform-origin: 0% 50%;
    }
    @keyframes progressLoad {
      0% { transform: scaleX(0); }
      50% { transform: scaleX(0.7); }
      100% { transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img
      src="src-tauri/icons/128x128@2x.png"
      alt="4to7 Mania Splash"
      class="splash-image"
      loading="eager"
      decoding="sync"
    />

  </div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      await new Promise(r => setTimeout(r, 2000));
      try {
        if (window.__TAURI__ && window.__TAURI__.core && typeof window.__TAURI__.core.invoke === "function") {
          await window.__TAURI__.core.invoke("splash_screen");
        } else if (window.__TAURI__ && typeof window.__TAURI__.invoke === "function") {
          await window.__TAURI__.invoke("splash_screen");
        } else if (window.__TAURI_INTERNALS__ && typeof window.__TAURI_INTERNALS__.invoke === "function") {
          await window.__TAURI_INTERNALS__.invoke("splash_screen");
        }
      } catch (e) {
        console.error("Failed to finish splash:", e);
      }
    });
  </script>
</body>
</html>
