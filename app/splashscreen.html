<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cargando 4to7 Mania...</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0b0e14;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }
      .splash-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0b0e14;
        gap: 16px;
      }
      .splash-image {
        width: 110px;
        height: 110px;
        object-fit: contain;
        border-radius: 22px;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.6),
          0 0 20px rgba(91, 140, 255, 0.25);
      }
      .splash-title {
        color: #ffffff;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.3px;
        margin: 0;
      }
      .splash-loader {
        width: 130px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
      }
      .splash-loader-bar {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #5b8cff, #a3ff38);
        border-radius: 2px;
        animation: progressLoad 1.8s ease-in-out infinite;
        transform-origin: 0% 50%;
      }
      @keyframes progressLoad {
        0% {
          transform: scaleX(0);
        }
        50% {
          transform: scaleX(0.7);
        }
        100% {
          transform: scaleX(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <img src="logo.png" alt="4to7 Mania" class="splash-image" loading="eager" decoding="sync" />
      <h1 class="splash-title">4to7 Mania</h1>
      <!--<div class="splash-loader">
        <div class="splash-loader-bar"></div>
      </div> -->
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", async () => {
        await new Promise((r) => setTimeout(r, 1800));
        try {
          if (
            window.__TAURI__ &&
            window.__TAURI__.core &&
            typeof window.__TAURI__.core.invoke === "function"
          ) {
            await window.__TAURI__.core.invoke("splash_screen");
          } else if (window.__TAURI__ && typeof window.__TAURI__.invoke === "function") {
            await window.__TAURI__.invoke("splash_screen");
          } else if (
            window.__TAURI_INTERNALS__ &&
            typeof window.__TAURI_INTERNALS__.invoke === "function"
          ) {
            await window.__TAURI_INTERNALS__.invoke("splash_screen");
          }
        } catch (e) {
          console.error("Failed to finish splash:", e);
        }
      });
    </script>
  </body>
</html>
